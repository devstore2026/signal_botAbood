services:
  - type: web
    name: abood-chess-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -u bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PO_AUTH_FRAME
        sync: false
      - key: PO_WS_URL
        value: wss://demo-api-eu.po.market/socket.io/?EIO=4&transport=websocket
      - key: ALERT_CHAT_IDS
        sync: false
